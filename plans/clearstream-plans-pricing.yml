created: '2026-05-04'
generated: '2026-09-05'
modified: '2026-09-05'
method: searched
source: >-
  Clearstream API services page —
  https://www.clearstream.com/clearstream-en/res-library/connectivity/clearstream-api-services-2916788
  (HTTP 200, fetched 2026-09-05) — and the Clearstream API Developer Guide (August 2025). Neither
  publishes a price, a tier or a quota. This file replaces a 2026-05-04 bulk-sweep scaffold that
  invented Free / Professional / Enterprise tiers with 1,000 and 100,000 request quotas;
  Clearstream publishes no such tiers and never did.
description: >-
  Clearstream publishes no API plans, no pricing page and no self-service tiers. API access is an
  extension of an existing Clearstream Banking client relationship: the client's Xact Organisation
  Unit must have the Clearstream API service granted, which is requested by sending a SWIFT MT599
  message to CEDELULLXXX (attn. PRGConnect) naming the API resources to link. The only price
  Clearstream states anywhere in public is that the Clearstream API Playground is "provided free
  of charge"; every other API's commercials sit inside the client contract and the Clearstream fee
  schedule, not on a pricing page.
plan_count: 0
plans: []
access_model:
  self_service: false
  free_tier: false
  trial: false
  public_signup: false
  contact: connect@clearstream.com
  onboarding_channel: SWIFT MT599 to CEDELULLXXX, attn. PRGConnect
  prerequisite: An active Clearstream Xact Web Portal Organisation Unit with at least two administrators.
published_price_points:
  - item: Clearstream API Playground
    price: free of charge
    source: >-
      Clearstream API Developer Guide, "Getting Started" — "It is recommended to start with the
      'Clearstream API Playground' which offers a variety of synthetic endpoints and is provided
      free of charge."
notes:
  - >-
    Clearstream's fee schedules for its post-trade services are published in the resource library
    key-documents section, but they price settlement, custody, collateral and fund services — not
    API calls. No API metering, overage or per-request price is published.
  - >-
    A `Pricing` pointer was added to apis.yml on 2026-09-05 aimed at the Clearstream Fee Schedule
    landing page (https://www.clearstream.com/clearstream-en/res-library/key-documents/clearstream-fee-schedule-1274812,
    HTTP 200). That is Clearstream's real, published price list — for settlement, custody,
    collateral and fund services, revised several times a year — and it is the only pricing this
    company publishes. It is NOT an API price list, and this artifact's plan_count of 0 stands:
    no per-call price, quota, tier or overage is published anywhere.
