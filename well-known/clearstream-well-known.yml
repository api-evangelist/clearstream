source: >-
  Direct HTTP probes on 2026-09-05 of every host this record knows — the registrable domain and
  www, the production API host, the pre-production API host, and the Xact portal host.
description: >-
  Well-known discovery probe for Clearstream. Result: nothing is served. No host under
  clearstream.com publishes security.txt, an OpenID/OAuth discovery document, an api-catalog or
  an ai-plugin manifest. The API hosts answer an unknown path with the platform's own HTML
  landing page (200) or, during the maintenance window observed on this pass, a 503 HTML page —
  neither is a discovery document, and both are recorded as misses. This file documents an
  absence; no WellKnown or SecurityTxt pointer is emitted from it.
