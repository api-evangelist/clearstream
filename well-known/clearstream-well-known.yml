description: >-
  Well-known discovery probe for Clearstream. Result: nothing is served, anywhere. 144 probes
  across nine hosts returned not one document. No host under clearstream.com publishes a
  security.txt, an OpenID/OAuth discovery document, an api-catalog, an apis.json, an AAuth
  resource declaration, a UCP/ACP manifest, an ai-plugin manifest or an agent card. This file
  documents an absence: NO WellKnown, SecurityTxt, APICatalog or AgentCard pointer is emitted
  from it.
