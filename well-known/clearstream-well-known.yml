related_hosts_not_clearstream:
  - host: www.deutsche-boerse.com
    path: /.well-known/security.txt
    status: 200
    note: >-
      The Deutsche Borse Group parent serves an RFC 9116 security.txt naming
      vulnerabilitydisclosure@deutsche-boerse.com and linking a VDP policy page. Recorded as
      context only, and deliberately NOT counted for Clearstream: it is served from the parent's
      own domain, its Expires field lapsed on 2025-04-22, and the linked policy page
      (https://www.deutsche-boerse.com/dbg-en/our-company/contact/report-vulnerabilities, 200,
      re-read 2026-09-05) states no scope — it names neither Clearstream nor any group subsidiary,
      nor any in-scope domain. Crediting Clearstream with it would assert a disclosure channel the
      published policy does not extend to clearstream.com.
