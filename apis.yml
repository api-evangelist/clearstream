  description: 'The Clearstream API Platform is the REST tier of ClearstreamXact, reachable at https://api.clearstream.com
    with a pre-production twin at https://api-t2s-test.clearstream.com. It issues JWT bearer tokens from
    /authmanager/oauth2/access_token using an OAuth 2.0 resource-owner password grant that Clearstream
    has hardened by requiring mutual TLS on every call, with the client certificate Common Name bound
    to the Xact user id in the token subject. The free Clearstream API Playground (scope ocapi-playground-v1,
    endpoints /playground/v1/info and /playground/v1/echo) is the recommended first integration and the
    resource Clearstream asks new clients to request during onboarding. Access is not self-service: a
    client enables the service for its Xact Organisation Unit by SWIFT MT599 message to CEDELULLXXX.'
