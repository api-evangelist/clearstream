description: 'Clearstream Banking S.A. is the Deutsche Borse Group post-trade infrastructure business,
  providing settlement, custody, collateral management and investment-fund order routing for international
  securities. Its programmable surface has two layers. The incumbent layer is regulated post-trade messaging:
  clients connect through ClearstreamXact (Xact Web Portal, Xact File Transfer over SWIFTNet FileAct,
  and Xact via SWIFT FIN), CASCADE via SWIFT and MQ, Vestima for fund order routing and CmaX for triparty
  collateral, exchanging ISO 15022 MT and ISO 20022 MX messages whose specifications Clearstream publishes
  to SWIFT MyStandards, with migration to ISO 20022 driven by the SWIFT CBPR+ programme. The newer layer
  is a genuine REST platform at api.clearstream.com, running an OAuth 2.0 password grant hardened by mandatory
  mutual TLS, whose first published API is SCIM 2.0 user management for the Xact Web Portal; a free synthetic
  Playground API and a CmaX collateral surface are live alongside it. The OpenAPI definitions are published
  into the Deutsche Borse Digital Business Platform catalogue, which requires registration.'
