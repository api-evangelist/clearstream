  description: 'CmaX is Clearstream''s triparty collateral management platform, automating collateral
    allocation, optimisation, margining and substitution across repo, securities lending and OTC derivative
    exposures. Clients instruct it over SWIFT colr.* messages and Xact File Transfer feeds, and it also
    has a live REST surface on the Clearstream API Platform: an unauthenticated GET to https://api-t2s-test.clearstream.com/cmax/v1
    returned HTTP 403 on 2026-09-05 naming the required OAuth scopes `allow` and `cmax-api`. The operations
    behind that prefix are documented only in the registration-gated Deutsche Borse Digital Business Platform
    catalogue.'
  baseURL: https://api.clearstream.com
